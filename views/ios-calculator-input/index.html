<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Calculator</title>
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
  <div class="grid-container">
    <div class="answer">0</div>
    <div class="extras grid">
        <button class="button"><span>(</span></button>
        <button class="button"><span>)</span></button>
        <button class="button"><span>mc</span></button>
        <button class="button"><span>m+</span></button>
        <button class="button"><span>m-</span></button>
        <button class="button"><span>mr</span></button>
        <button class="button"><span>x<sup>2</sup></span></button>
        <button class="button"><span>x<sup>3</sup></span></button>
        <button class="button"><span>x<sup>y</sup></span></button>
        <button class="button"><span><sup>1</sup>/<sub>x</sub></span></button>
        <button class="button"><span>e<sup>x</sup></span></button>
        <button class="button"><span>10<sup>x</sup></span></button>
        <button class="button"><span><sup>2</sup>&Sqrt;x</span></button>
        <button class="button"><span><sup>3</sup>&Sqrt;x</span></button>
        <button class="button"><span><sup>y</sup>&Sqrt;x</span></button>
        <button class="button"><span>log<sub>y</sub></span></button>
        <button class="button"><span>ln</span></button>
        <button class="button"><span>log<sub>10</sub></span></button>
        <button class="button"><span>x!</span></button>
        <button class="button"><span>sin</span></button>
        <button class="button"><span>cos</span></button>
        <button class="button"><span>tan</span></button>
        <button class="button"><span>e</span></button>
        <button class="button"><span>EE</span></button>
        <button class="button"><span>Rad</span></button>
        <button class="button"><span>sin<sup>-1</sup></span></button>
        <button class="button"><span>cos<sup>-1</sup></span></button>
        <button class="button"><span>tan<sup>-1</sup></span></button>
        <button class="button"><span>&pi;</span></button>
        <button class="button"><span>Rand</span></button>
    </div>
    <div class="basics grid">
      <button class="button"><span>AC</span></button>
      <button class="button"><span>+/&minus;</span></button>
      <button class="button"><span>%</span></button>
      <button class="button operator"><span>&divide;</span></button>
      <button class="button number">7</button>
      <button class="button number">8</button>
      <button class="button number">9</button>
      <button class="button operator"><span>&times;</span></button>
      <button class="button number">4</button>
      <button class="button number">5</button>
      <button class="button number">6</button>
      <button class="button operator"><span>&minus;</span></button>
      <button class="button number">1</button>
      <button class="button number">2</button>
      <button class="button number">3</button>
      <button class="button operator"><span>+</span></button>
      <button class="button number double">0</button>
      <button class="button number"><span>.</span></button>
      <button class="button operator"><span>=</span></button>
    </div>
  </div>
</body>
</html>
